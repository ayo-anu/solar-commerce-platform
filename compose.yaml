services:
  postgres-dev:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: solar_platform_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-dev-password
    secrets:
      - postgres-dev-password
    ports:
      - "127.0.0.1:${SOLAR_PLATFORM_POSTGRES_DEV_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  postgres-test:
    image: postgres:18.6-bookworm
    profiles:
      - test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: solar_platform_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-test-password
    secrets:
      - postgres-test-password
    ports:
      - "127.0.0.1:${SOLAR_PLATFORM_POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
        tmpfs:
          size: 268435456
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    stop_grace_period: 30s

secrets:
  postgres-dev-password:
    file: ./.secrets/postgres-dev-password
  postgres-test-password:
    file: ./.secrets/postgres-test-password

volumes:
  postgres-dev-data:

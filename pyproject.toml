[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "solar-platform-backend"
version = "0.1.0"
description = "Production-grade ecommerce backend foundation for a solar-energy platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/solar_platform"]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<2.4",
    "ruff>=0.16.7,<0.17",
]

[tool.ruff]
line-length = 88
indent-width = 4
src = ["src"]
include = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "RUF",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
